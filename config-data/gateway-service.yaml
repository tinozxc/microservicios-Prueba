server:
  port: ${PORT:8080}
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuario-service
              uri: lb://usuario-service
              predicates:
                - Path=/usuario/**
            - id: moto-service
              uri: lb://moto-service
              predicates:
                - Path=/moto/**
            - id: carro-service
              uri: lb://carro-service
              predicates:
                - Path=/carro/**